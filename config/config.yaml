light_scan_sim_node:
  ros__parameters:
    freq_hz: 10.0
    range_min: 0.1  # Min range (m)
    range_max: 20.0  # Max range (m)
    range_noise: 0.005  # Standard deviation of gaussian noise (m)
    angle_min: -1.571  # The min scan angle (radians)
    angle_max: 1.571  # The max scan angle (inclusive, radians)
    angle_increment: 0.01  # The angle increment to scan at (radians)
    map:
      topic: "/map"  # The map topic to subscribe to
      image_frame: "map_image"  # An intemediate TF frame generated by laser_scan_sim
      materials_topic: "/map_materials"  # The materials list
      segments_topic: "/map_segments"  # The wall segment list
    laser:
      topic: "/scan"  # The LaserScan topic to publish
      frame: "laser"  # The tf frame that the laser is based in
      frame_out: "laser"
      base_frame: "base_link"
      odom_frame: "odom"
